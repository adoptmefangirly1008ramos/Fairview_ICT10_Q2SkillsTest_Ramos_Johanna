<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script><title>ICT 10</title>
    
    <style>
     
        body {
            background-color: #2457a7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        h1 {
            color: #1565C0;
            font-weight: bold;
            margin-bottom: 15px;
        }

        input {
            width: 98%;
            padding: 12px;
            border: 2px solid #2196F3;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 18px;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background-color: #1565C0;
            color: white;
            border: none;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin: 15px 0;

        }

        button:hover {
            background-color: #0D47A1;
        }

        .result {
            background-color: #E3F2FD;
            padding: 20px;
            border-radius: 10px;
            margin-top: 25px;
            text-align: left;
        }

        .result h3 {
            text-align: center;
            color: #1565C0;
            margin-bottom: 20px;
        }

    
    </style>

</head>

<body>

    <div class="container">

        <h1>Non-Metal Elements</h1>
        <p>Enter the symbol of a non-metal element</p>
        <input type="text" id="element1" placeholder="Example: H">
        <br><br>

        <button py-click="search_element">Search Element</button>

        <div class="result">
            <h3>Search Results</h3>
            <p><b>Element Symbol:</b> <span id="symbol"></span></p>
            <p><b>Element Name:</b> <span id="name"></span></p>
            <p><b>Atomic Number:</b> <span id="number"></span></p>
            <p><b>Atomic Mass:</b> <span id="mass"></span></p>

        </div>

    </div>

    <script type="py" src="main.py"></script>

</body>

</body>
</html>
